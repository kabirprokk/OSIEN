<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
  >

  <title>Py_Editor</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  >

  <style>
    /* =========================================================
       GLOBAL
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family:
        'Inter',
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #080b10;
      min-height: 100vh;

      display: flex;
      align-items: stretch;
      justify-content: stretch;

      padding: 0;

      overflow: hidden;
    }


    /* =========================================================
       THEMES
    ========================================================= */

    .theme-deepsea {
      --bg-editor: #0a0f16;
      --bg-input: #111a24;
      --border-input: #1e3242;

      --text-primary: #d6e6f5;
      --text-secondary: #8aaccc;

      --accent: #2f8cf0;
      --accent-glow: rgba(47, 140, 240, 0.25);

      --toolbar-bg: #0a0f16;

      --icon-color: #6a9ed4;

      --file-tag-bg: #16222e;

      --line-number-color: #3a5a7a;

      --app-name-color: #5a8ac4;

      --scrollbar-color: #1e3242;
    }

    .theme-galaxy {
      --bg-editor: #0f0818;
      --bg-input: #1a1028;
      --border-input: #3a2068;

      --text-primary: #e3d6ff;
      --text-secondary: #a88ad4;

      --accent: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.3);

      --toolbar-bg: #0f0818;

      --icon-color: #9a7acc;

      --file-tag-bg: #241838;

      --line-number-color: #5a3a7a;

      --app-name-color: #8a6abc;

      --scrollbar-color: #3a2068;
    }

    .theme-matrix {
      --bg-editor: #080f0a;
      --bg-input: #0e1a12;
      --border-input: #1a4a2a;

      --text-primary: #b8f0c8;
      --text-secondary: #6ab880;

      --accent: #32cd7a;
      --accent-glow: rgba(50, 205, 122, 0.25);

      --toolbar-bg: #080f0a;

      --icon-color: #4ab86a;

      --file-tag-bg: #14281a;

      --line-number-color: #2a5a3a;

      --app-name-color: #4a9a5a;

      --scrollbar-color: #1a4a2a;
    }


    /* =========================================================
       MAIN APPLICATION
    ========================================================= */

    .editor-container {
      width: 100%;
      max-width: none;

      height: 100vh;
      min-height: 100vh;

      margin: 0;

      background: var(--bg-editor);

      border-radius: 0;

      padding: 20px 24px 18px;

      border: none;

      box-shadow: none;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      transition:
        background 0.25s ease,
        border-color 0.25s ease;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .app-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 12px;

      padding: 0 2px;

      flex-shrink: 0;
    }

    .app-name {
      font-size: 1.35rem;

      font-weight: 700;

      letter-spacing: -0.5px;

      display: flex;

      align-items: center;

      gap: 8px;
    }

    .app-name i {
      font-size: 1.2rem;

      color: var(--accent);

      filter:
        drop-shadow(
          0 0 6px var(--accent-glow)
        );
    }

    .app-name span {
      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--app-name-color)
        );

      -webkit-background-clip: text;
      background-clip: text;

      -webkit-text-fill-color: transparent;

      font-weight: 800;
    }

    .app-version {
      font-size: 0.6rem;

      color: var(--text-secondary);

      opacity: 0.4;

      letter-spacing: 0.5px;

      font-weight: 500;
    }


    /* =========================================================
       TOOLBAR
    ========================================================= */

    .toolbar {
      display: flex;

      flex-wrap: wrap;

      align-items: center;

      justify-content: space-between;

      gap: 8px;

      background: var(--toolbar-bg);

      padding: 8px 10px;

      border-radius: 40px;

      margin-bottom: 14px;

      border: 1px solid var(--border-input);

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);

      flex-shrink: 0;
    }

    .toolbar-left {
      display: flex;

      align-items: center;

      gap: 6px;

      flex-wrap: wrap;

      flex: 1;

      min-width: 0;
    }

    .toolbar-right {
      display: flex;

      align-items: center;

      gap: 4px;

      flex-shrink: 0;
    }


    /* =========================================================
       FILE BADGE
    ========================================================= */

    .file-badge {
      background: var(--file-tag-bg);

      padding: 5px 12px;

      border-radius: 30px;

      font-size: 0.75rem;

      font-weight: 500;

      letter-spacing: 0.2px;

      color: var(--text-secondary);

      border: 1px solid var(--border-input);

      display: flex;

      align-items: center;

      gap: 5px;

      white-space: nowrap;

      max-width: 180px;

      overflow: hidden;

      text-overflow: ellipsis;

      cursor: pointer;

      transition: 0.2s ease;

      user-select: none;
    }

    .file-badge:hover {
      border-color: var(--accent);

      background: var(--accent-glow);
    }

    .file-badge i {
      font-size: 0.7rem;

      color: var(--accent);

      flex-shrink: 0;
    }

    #fileName {
      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }


    /* =========================================================
       BUTTONS
    ========================================================= */

    .btn-icon {
      background: rgba(255, 255, 255, 0.02);

      border: 1px solid transparent;

      color: var(--icon-color);

      font-size: 1.1rem;

      padding: 5px 8px;

      border-radius: 30px;

      transition: 0.2s ease;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-width: 36px;

      min-height: 36px;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    .btn-icon:hover,
    .btn-icon:active {
      background: var(--accent-glow);

      border-color: var(--accent);

      color: var(--accent);
    }

    .btn-icon:active {
      transform: scale(0.92);
    }


    /* =========================================================
       MODE SELECTOR
    ========================================================= */

    .mode-selector {
      display: flex;

      gap: 3px;

      background: rgba(0, 0, 0, 0.3);

      padding: 3px;

      border-radius: 40px;

      border: 1px solid var(--border-input);
    }

    .mode-btn {
      background: transparent;

      border: none;

      padding: 4px 10px;

      border-radius: 30px;

      font-size: 0.6rem;

      font-weight: 600;

      letter-spacing: 0.3px;

      color: var(--text-secondary);

      transition: 0.2s ease;

      cursor: pointer;

      text-transform: uppercase;

      -webkit-tap-highlight-color: transparent;
    }

    .mode-btn.active {
      background: var(--accent);

      color: #0b0e14;

      box-shadow:
        0 0 12px var(--accent-glow);
    }

    .mode-btn:active {
      transform: scale(0.92);
    }


    /* =========================================================
       EDITOR WRAPPER
    ========================================================= */

    .editor-wrapper {
      display: flex;

      width: 100%;

      flex: 1;

      min-height: 0;

      background: var(--bg-input);

      border: 1px solid var(--border-input);

      border-radius: 16px;

      overflow: hidden;

      position: relative;

      box-shadow:
        inset 0 4px 16px rgba(0, 0, 0, 0.5);

      transition: 0.2s ease;
    }

    .editor-wrapper:focus-within {
      border-color: var(--accent);

      box-shadow:
        0 0 0 3px var(--accent-glow),
        inset 0 4px 16px rgba(0, 0, 0, 0.5);
    }


    /* =========================================================
       LINE NUMBERS
    ========================================================= */

    .line-numbers-container {
      background: var(--bg-input);

      color: var(--line-number-color);

      font-family:
        'JetBrains Mono',
        'Fira Code',
        'Menlo',
        monospace;

      font-size: 0.9rem;

      line-height: 1.7;

      text-align: right;

      min-width: 44px;

      flex-shrink: 0;

      user-select: none;

      pointer-events: none;

      border-right: 1px solid var(--border-input);

      opacity: 0.6;

      position: relative;

      overflow: hidden;

      padding: 18px 0;

      z-index: 5;
    }

    .line-numbers-inner {
      padding-right: 10px;

      padding-left: 6px;

      will-change: transform;

      transform: translateY(0);

      transition: none;
    }

    .line-numbers-container span {
      display: block;

      font-size: 0.9rem;

      line-height: 1.7;

      height: 1.7em;

      font-variant-numeric: tabular-nums;

      letter-spacing: 0;

      font-weight: 400;
    }


    /* =========================================================
       CODE SCROLL AREA
    ========================================================= */

    .code-area-wrapper {
      flex: 1;

      min-width: 0;

      min-height: 0;

      overflow: auto;

      position: relative;

      background: transparent;

      overscroll-behavior: contain;

      -webkit-overflow-scrolling: touch;

      scrollbar-width: thin;

      scrollbar-color:
        var(--scrollbar-color)
        transparent;
    }

    .code-area-wrapper::-webkit-scrollbar {
      width: 6px;

      height: 6px;
    }

    .code-area-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }

    .code-area-wrapper::-webkit-scrollbar-thumb {
      background: var(--scrollbar-color);

      border-radius: 10px;
    }


    /* =========================================================
       CODE TEXTAREA
    ========================================================= */

    .code-area {
      display: block;

      margin: 0;

      padding: 18px 16px;

      background: transparent;

      color: var(--text-primary);

      font-family:
        'JetBrains Mono',
        'Fira Code',
        'Menlo',
        monospace;

      font-size: 0.9rem;

      line-height: 1.7;

      letter-spacing: 0.1px;

      border: none;

      outline: none;

      resize: none;

      overflow: hidden;

      white-space: pre;

      tab-size: 4;

      -moz-tab-size: 4;

      min-width: 100%;

      min-height: 100%;

      width: 100%;

      height: 100%;

      box-sizing: border-box;

      caret-color: var(--accent);
    }

    .code-area::placeholder {
      color: var(--text-secondary);

      opacity: 0.3;

      font-weight: 300;
    }


    /* =========================================================
       STATUS BAR
    ========================================================= */

    .status-bar {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-top: 10px;

      padding: 0 6px;

      color: var(--text-secondary);

      font-size: 0.65rem;

      letter-spacing: 0.2px;

      opacity: 0.6;

      flex-wrap: wrap;

      gap: 4px;

      flex-shrink: 0;
    }

    .status-bar i {
      margin-right: 4px;

      font-size: 0.6rem;
    }


    /* =========================================================
       FILE INPUT
    ========================================================= */

    #fileInput {
      display: none;
    }


    /* =========================================================
       RENAME MODAL
    ========================================================= */

    .rename-modal {
      display: none;

      position: fixed;

      inset: 0;

      background: rgba(0, 0, 0, 0.7);

      backdrop-filter: blur(8px);

      -webkit-backdrop-filter: blur(8px);

      align-items: center;

      justify-content: center;

      z-index: 999;

      padding: 20px;
    }

    .rename-modal.active {
      display: flex;
    }

    .rename-box {
      background: var(--bg-editor);

      border: 1px solid var(--border-input);

      border-radius: 28px;

      padding: 28px 24px 24px;

      max-width: 360px;

      width: 100%;

      box-shadow:
        0 32px 64px rgba(0, 0, 0, 0.9);

      animation:
        modalIn 0.18s ease-out;
    }

    @keyframes modalIn {

      from {
        opacity: 0;

        transform:
          scale(0.96)
          translateY(8px);
      }

      to {
        opacity: 1;

        transform:
          scale(1)
          translateY(0);
      }
    }

    .rename-box h3 {
      color: var(--text-primary);

      font-size: 1rem;

      font-weight: 600;

      margin-bottom: 16px;

      letter-spacing: 0.3px;
    }

    .rename-box input {
      width: 100%;

      padding: 12px 16px;

      background: var(--bg-input);

      border: 1px solid var(--border-input);

      border-radius: 40px;

      color: var(--text-primary);

      font-size: 0.9rem;

      outline: none;

      transition: 0.2s;

      margin-bottom: 16px;
    }

    .rename-box input:focus {
      border-color: var(--accent);

      box-shadow:
        0 0 0 3px var(--accent-glow);
    }

    .rename-actions {
      display: flex;

      gap: 10px;

      justify-content: flex-end;
    }

    .rename-actions button {
      padding: 8px 18px;

      border-radius: 40px;

      border: 1px solid var(--border-input);

      background: transparent;

      color: var(--text-secondary);

      font-weight: 500;

      font-size: 0.8rem;

      cursor: pointer;

      transition: 0.2s;
    }

    .rename-actions button:hover {
      background: var(--accent-glow);

      border-color: var(--accent);

      color: var(--accent);
    }

    .rename-actions button.primary {
      background: var(--accent);

      color: #0b0e14;

      border-color: var(--accent);
    }

    .rename-actions button.primary:hover {
      opacity: 0.85;

      transform: scale(0.96);
    }


    /* =========================================================
       DRAG STATE
    ========================================================= */

    .editor-container.dragging {
      outline: 2px solid var(--accent);

      outline-offset: -2px;

      box-shadow:
        inset 0 0 30px var(--accent-glow);
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

      .editor-container {
        padding:
          12px
          8px
          10px;
      }

      .app-name {
        font-size: 1.1rem;
      }

      .app-name i {
        font-size: 1rem;
      }

      .toolbar {
        padding: 6px 8px;

        gap: 4px;

        border-radius: 18px;
      }

      .btn-icon {
        min-width: 32px;

        min-height: 32px;

        font-size: 0.95rem;

        padding: 4px 6px;
      }

      .mode-btn {
        padding: 3px 8px;

        font-size: 0.55rem;
      }

      .file-badge {
        max-width: 100px;

        font-size: 0.65rem;

        padding: 4px 10px;
      }

      .code-area {
        font-size: 0.8rem;

        line-height: 1.6;

        padding:
          14px
          10px;
      }

      .line-numbers-container {
        font-size: 0.8rem;

        line-height: 1.6;

        min-width: 34px;

        padding:
          14px
          0;
      }

      .line-numbers-container span {
        font-size: 0.8rem;

        line-height: 1.6;

        height: 1.6em;
      }

      .line-numbers-inner {
        padding-right: 7px;

        padding-left: 4px;
      }

      .status-bar {
        font-size: 0.55rem;
      }
    }


    @media (max-width: 390px) {

      .toolbar {
        flex-direction: column;

        align-items: stretch;
      }

      .toolbar-left {
        justify-content: center;
      }

      .toolbar-right {
        justify-content: center;
      }

      .mode-selector {
        flex: 1;

        justify-content: center;
      }
    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }

  </style>
</head>


<body>

  <div
    class="editor-container theme-deepsea"
    id="appContainer"
  >

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="app-header">

      <div class="app-name">

        <i class="fas fa-terminal"></i>

        <span>Py_Editor</span>

      </div>


      <div class="app-version">

        <i class="fas fa-code"></i>

        v2.0

      </div>

    </div>


    <!-- =====================================================
         TOOLBAR
    ====================================================== -->

    <div class="toolbar">

      <div class="toolbar-left">

        <div
          class="file-badge"
          id="fileBadge"
          title="Click to rename"
        >

          <i class="fas fa-file-code"></i>

          <span id="fileName">
            main.py
          </span>

        </div>


        <button
          class="btn-icon"
          id="openBtn"
          type="button"
          title="Open file"
        >

          <i class="fas fa-folder-open"></i>

        </button>

      </div>


      <div class="toolbar-right">

        <button
          class="btn-icon"
          id="downloadBtn"
          type="button"
          title="Download"
        >

          <i class="fas fa-download"></i>

        </button>


        <div class="mode-selector">

          <button
            class="mode-btn active"
            data-theme="deepsea"
            type="button"
          >
            Sea
          </button>

          <button
            class="mode-btn"
            data-theme="galaxy"
            type="button"
          >
            Galaxy
          </button>

          <button
            class="mode-btn"
            data-theme="matrix"
            type="button"
          >
            Matrix
          </button>

        </div>

      </div>

    </div>


    <!-- =====================================================
         EDITOR
    ====================================================== -->

    <div class="editor-wrapper">

      <div
        class="line-numbers-container"
        id="lineNumbersContainer"
      >

        <div
          class="line-numbers-inner"
          id="lineNumbersInner"
        ></div>

      </div>


      <div class="code-area-wrapper">

        <textarea
          class="code-area"
          id="editor"
          spellcheck="false"
          wrap="off"
          aria-label="Python code editor"
          placeholder="# write your Python code here ..."
        >print("Hello, Py_Editor 🐍")</textarea>

      </div>

    </div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div class="status-bar">

      <span>

        <i class="fas fa-code"></i>

        Python · read/write

      </span>


      <span id="lineCount">

        <i class="far fa-file-alt"></i>

        1 line

      </span>

    </div>


    <!-- =====================================================
         FILE INPUT
    ====================================================== -->

    <input
      type="file"
      id="fileInput"
      accept=".py,.txt,.json,.js,.html,.css,.md,.xml,.csv"
    >


    <!-- =====================================================
         RENAME MODAL
    ====================================================== -->

    <div
      class="rename-modal"
      id="renameModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="renameTitle"
    >

      <div class="rename-box">

        <h3 id="renameTitle">

          <i
            class="fas fa-pen"
            style="margin-right: 8px;"
          ></i>

          Rename file

        </h3>


        <input
          type="text"
          id="renameInput"
          placeholder="filename.py"
          spellcheck="false"
          autocomplete="off"
        >


        <div class="rename-actions">

          <button
            id="renameCancel"
            type="button"
          >
            Cancel
          </button>


          <button
            class="primary"
            id="renameConfirm"
            type="button"
          >
            Rename
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- =======================================================
       JAVASCRIPT
  ======================================================== -->

  <script>

    (() => {

      "use strict";


      /* =====================================================
         DOM
      ===================================================== */

      const container =
        document.getElementById(
          "appContainer"
        );

      const editor =
        document.getElementById(
          "editor"
        );

      const lineNumbersInner =
        document.getElementById(
          "lineNumbersInner"
        );

      const fileNameSpan =
        document.getElementById(
          "fileName"
        );

      const fileBadge =
        document.getElementById(
          "fileBadge"
        );

      const openBtn =
        document.getElementById(
          "openBtn"
        );

      const downloadBtn =
        document.getElementById(
          "downloadBtn"
        );

      const fileInput =
        document.getElementById(
          "fileInput"
        );

      const lineCount =
        document.getElementById(
          "lineCount"
        );

      const modeBtns =
        document.querySelectorAll(
          ".mode-btn"
        );

      const renameModal =
        document.getElementById(
          "renameModal"
        );

      const renameInput =
        document.getElementById(
          "renameInput"
        );

      const renameConfirm =
        document.getElementById(
          "renameConfirm"
        );

      const renameCancel =
        document.getElementById(
          "renameCancel"
        );

      const scrollWrapper =
        editor.parentElement;


      /* =====================================================
         STATE
      ===================================================== */

      let currentFileName =
        "main.py";

      let resizeTimer = null;

      let dragCounter = 0;


      const VALID_EXTENSIONS = [
        ".py",
        ".txt",
        ".json",
        ".js",
        ".html",
        ".css",
        ".md",
        ".xml",
        ".csv"
      ];


      /* =====================================================
         FILE VALIDATION
      ===================================================== */

      function isValidFile(file) {

        if (!file) {
          return false;
        }

        const name =
          file.name.toLowerCase();

        return VALID_EXTENSIONS.some(
          ext => name.endsWith(ext)
        );
      }


      /* =====================================================
         LINE NUMBERS
      ===================================================== */

      function updateLineNumbers() {

        const lines =
          (editor.value || "").split("\n");

        const total =
          lines.length;


        let html = "";

        for (
          let i = 1;
          i <= total;
          i++
        ) {

          html +=
            `<span>${i}</span>`;
        }


        lineNumbersInner.innerHTML =
          html;


        lineCount.innerHTML =
          `<i class="far fa-file-alt"></i> ` +
          `${total} ` +
          `line${total !== 1 ? "s" : ""}`;


        syncLineNumbers();
      }


      /* =====================================================
         LINE NUMBER SCROLL
      ===================================================== */

      function syncLineNumbers() {

        const scrollTop =
          scrollWrapper.scrollTop;


        lineNumbersInner.style.transform =
          `translateY(-${scrollTop}px)`;
      }


      /* =====================================================
         THEME
      ===================================================== */

      function setTheme(theme) {

        const themes = [
          "deepsea",
          "galaxy",
          "matrix"
        ];


        if (!themes.includes(theme)) {
          return;
        }


        container.classList.remove(
          "theme-deepsea",
          "theme-galaxy",
          "theme-matrix"
        );


        container.classList.add(
          `theme-${theme}`
        );


        modeBtns.forEach(btn => {

          btn.classList.toggle(
            "active",
            btn.dataset.theme === theme
          );

        });
      }


      /* =====================================================
         OPEN FILE
      ===================================================== */

      function openFile(file) {

        if (!file) {
          return;
        }


        if (!isValidFile(file)) {

          console.warn(
            "Unsupported file:",
            file.name
          );

          return;
        }


        const reader =
          new FileReader();


        reader.onload =
          event => {

            const text =
              typeof event.target.result ===
              "string"
                ? event.target.result
                : "";


            editor.value =
              text;


            currentFileName =
              file.name ||
              "code.py";


            fileNameSpan.textContent =
              currentFileName;


            scrollWrapper.scrollTop =
              0;

            scrollWrapper.scrollLeft =
              0;


            updateLineNumbers();

          };


        reader.onerror =
          () => {

            editor.value =
              "# Error: Could not read this file.";

            updateLineNumbers();

          };


        reader.readAsText(file);
      }


      /* =====================================================
         RENAME
      ===================================================== */

      function openRenameModal() {

        renameInput.value =
          currentFileName;


        renameModal.classList.add(
          "active"
        );


        setTimeout(() => {

          renameInput.focus();

          renameInput.select();

        }, 50);
      }


      function closeRenameModal() {

        renameModal.classList.remove(
          "active"
        );
      }


      function applyRename() {

        const newName =
          renameInput.value.trim();


        if (!newName) {

          renameInput.focus();

          return;
        }


        currentFileName =
          newName;


        fileNameSpan.textContent =
          currentFileName;


        closeRenameModal();
      }


      /* =====================================================
         MIME TYPE
      ===================================================== */

      function getMimeType(fileName) {

        const extension =
          fileName
            .split(".")
            .pop()
            .toLowerCase();


        const types = {

          py:
            "text/x-python;charset=utf-8",

          txt:
            "text/plain;charset=utf-8",

          js:
            "text/javascript;charset=utf-8",

          json:
            "application/json;charset=utf-8",

          html:
            "text/html;charset=utf-8",

          css:
            "text/css;charset=utf-8",

          md:
            "text/markdown;charset=utf-8",

          xml:
            "application/xml;charset=utf-8",

          csv:
            "text/csv;charset=utf-8"
        };


        return (
          types[extension] ||
          "text/plain;charset=utf-8"
        );
      }


      /* =====================================================
         DOWNLOAD
      ===================================================== */

      function downloadCurrentCode() {

        try {

          const blob =
            new Blob(
              [editor.value],
              {
                type:
                  getMimeType(
                    currentFileName
                  )
              }
            );


          const url =
            URL.createObjectURL(
              blob
            );


          const link =
            document.createElement(
              "a"
            );


          link.href =
            url;

          link.download =
            currentFileName;

          link.style.display =
            "none";


          document.body.appendChild(
            link
          );


          link.click();


          link.remove();


          setTimeout(() => {

            URL.revokeObjectURL(
              url
            );

          }, 1000);

        } catch (error) {

          console.error(
            "Download error:",
            error
          );
        }
      }


      /* =====================================================
         BUTTON EVENTS
      ===================================================== */

      openBtn.addEventListener(
        "click",
        () => fileInput.click()
      );


      downloadBtn.addEventListener(
        "click",
        downloadCurrentCode
      );


      fileBadge.addEventListener(
        "click",
        openRenameModal
      );


      renameConfirm.addEventListener(
        "click",
        applyRename
      );


      renameCancel.addEventListener(
        "click",
        closeRenameModal
      );


      /* =====================================================
         FILE INPUT
      ===================================================== */

      fileInput.addEventListener(
        "change",
        event => {

          const files =
            event.target.files;


          if (
            files &&
            files.length
          ) {

            openFile(
              files[0]
            );
          }


          fileInput.value = "";

        }
      );


      /* =====================================================
         RENAME KEYBOARD
      ===================================================== */

      renameInput.addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            applyRename();

          }


          if (
            event.key === "Escape"
          ) {

            event.preventDefault();

            closeRenameModal();

          }

        }
      );


      /* =====================================================
         CLOSE MODAL
      ===================================================== */

      renameModal.addEventListener(
        "click",
        event => {

          if (
            event.target ===
            renameModal
          ) {

            closeRenameModal();

          }

        }
      );


      /* =====================================================
         EDITOR INPUT
      ===================================================== */

      editor.addEventListener(
        "input",
        updateLineNumbers
      );


      /* =====================================================
         TAB SUPPORT
      ===================================================== */

      editor.addEventListener(
        "keydown",
        event => {

          if (
            event.key !== "Tab"
          ) {
            return;
          }


          event.preventDefault();


          const start =
            editor.selectionStart;

          const end =
            editor.selectionEnd;

          const value =
            editor.value;


          editor.value =
            value.slice(0, start) +
            "    " +
            value.slice(end);


          editor.selectionStart =
            start + 4;

          editor.selectionEnd =
            start + 4;


          updateLineNumbers();
        }
      );


      /* =====================================================
         SCROLL
      ===================================================== */

      scrollWrapper.addEventListener(
        "scroll",
        syncLineNumbers,
        {
          passive: true
        }
      );


      /* =====================================================
         RESIZE
      ===================================================== */

      window.addEventListener(
        "resize",
        () => {

          clearTimeout(
            resizeTimer
          );


          resizeTimer =
            setTimeout(() => {

              syncLineNumbers();

            }, 100);

        }
      );


      /* =====================================================
         THEMES
      ===================================================== */

      modeBtns.forEach(btn => {

        btn.addEventListener(
          "click",
          () => {

            setTheme(
              btn.dataset.theme
            );

          }
        );

      });


      /* =====================================================
         DRAG & DROP
      ===================================================== */

      container.addEventListener(
        "dragenter",
        event => {

          event.preventDefault();

          dragCounter++;

          container.classList.add(
            "dragging"
          );

        }
      );


      container.addEventListener(
        "dragover",
        event => {

          event.preventDefault();

          if (
            event.dataTransfer
          ) {

            event.dataTransfer.dropEffect =
              "copy";
          }

        }
      );


      container.addEventListener(
        "dragleave",
        event => {

          event.preventDefault();

          dragCounter--;


          if (
            dragCounter <= 0
          ) {

            dragCounter = 0;

            container.classList.remove(
              "dragging"
            );
          }

        }
      );


      container.addEventListener(
        "drop",
        event => {

          event.preventDefault();


          dragCounter = 0;


          container.classList.remove(
            "dragging"
          );


          const files =
            event.dataTransfer.files;


          if (
            !files ||
            files.length === 0
          ) {
            return;
          }


          const file =
            files[0];


          if (
            isValidFile(file)
          ) {

            openFile(file);

          } else {

            console.warn(
              "Unsupported file type:",
              file.name
            );

          }

        }
      );


      /* =====================================================
         INITIALIZATION
      ===================================================== */

      setTheme(
        "deepsea"
      );


      updateLineNumbers();


      requestAnimationFrame(
        () => {

          syncLineNumbers();

        }
      );


      setTimeout(
        () => {

          syncLineNumbers();

        },
        100
      );


      /* =====================================================
         CONSOLE
      ===================================================== */

      console.log(
        "🐍 Py_Editor v2.0 initialized"
      );

      console.log(
        "↔️ Full-screen editor enabled"
      );

      console.log(
        "🔢 Line numbers synchronized"
      );

      console.log(
        "📁 File open/download enabled"
      );

      console.log(
        "🎨 Deep Sea / Galaxy / Matrix"
      );

    })();

  </script>

</body>
</html>
