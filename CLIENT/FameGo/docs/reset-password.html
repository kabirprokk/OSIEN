<!DOCTYPE html>
<!-- HIDDEN page: password recovery landing. Reached only from reset email. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>FameGo — Reset password</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="logo.svg" type="image/svg+xml" />
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<main class="auth">
  <div class="auth-card">
    <div class="logo">FAME<span>GO</span></div>
    <div class="sub">FAMEBROS STUDIO</div>
    <div class="auth-ic info" id="icon">◌</div>
    <h1 id="title">Set a new password</h1>
    <p id="msg">Passwords are set inside the app for security. Tap below — the app will open on the reset screen.</p>
    <a class="btn" id="primary" href="famego://auth/callback?type=recovery">Continue in FameGo app</a>
    <a class="ghost-btn" href="mailto:famebros.studio@gmail.com?subject=Password%20reset%20help">Need help? Contact support</a>
    <p class="fine">Link lasts 1 hour. Didn't ask for this? Your password stays as-is — ignore the email.</p>
  </div>
</main>
<script>
(function () {
  // Preserve Supabase recovery tokens when deep-linking back into the app.
  var suffix = (window.location.search || "") + (window.location.hash || "");
  var err = /error_description=|error=/.test(suffix);
  if (err) {
    document.getElementById("icon").className = "auth-ic err";
    document.getElementById("icon").textContent = "!";
    document.getElementById("title").textContent = "Link expired";
    document.getElementById("msg").textContent = "This reset link is invalid or expired. Open FameGo → Sign in → Forgot password for a fresh one.";
  } else if (suffix.length > 1) {
    document.getElementById("primary").href = "famego://auth/callback" + suffix;
  }
})();
</script>
</body>
</html>
