<!DOCTYPE html>
<!-- Paste into: Authentication > Email Templates > Reauthentication.
     Reauth delivers a one-time CODE ({{ .Token }}), not a link. -->
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body style="margin:0;padding:0;background:#070809;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#070809;padding:32px 16px;">
    <tr><td align="center">
      <table width="420" cellpadding="0" cellspacing="0" style="background:#111419;border:1px solid #F6B941;border-radius:22px;padding:40px 32px;text-align:center;">
        <tr><td style="font-size:30px;letter-spacing:3px;color:#ffffff;font-weight:800;">FAME<span style="color:#F6B941;">GO</span></td></tr>
        <tr><td style="color:#6E7683;font-size:10px;letter-spacing:4px;padding-top:6px;">FAMEBROS STUDIO</td></tr>
        <tr><td style="color:#F8FAFC;font-size:21px;font-weight:700;padding-top:26px;">It's really you?</td></tr>
        <tr><td style="color:#A6ADB8;font-size:14px;line-height:1.65;padding-top:10px;">
          Enter this code in the app to continue the sensitive step:
        </td></tr>
        <tr><td style="padding-top:22px;">
          <div style="display:inline-block;background:#070809;border:1px dashed #F6B941;border-radius:14px;padding:14px 28px;font-size:30px;letter-spacing:8px;color:#F6B941;font-weight:800;">
            {{ .Token }}
          </div>
        </td></tr>
        <tr><td style="color:#6E7683;font-size:11px;padding-top:18px;">
          Code expires in 15 minutes. Didn't ask for this? Ignore it.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
